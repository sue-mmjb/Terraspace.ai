<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TerraSpace: design your outdoor space from one photo. Planted from Hoang Lam's nursery at TERA Park 2 and installed by Hoang Lam crews.">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TerraSpace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Photo paths are absolute (/app/...) so the app works at / and at /app. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: white app shell. Phone: sticky top bar + bottom tab bar with a raised Create button. Desktop: left rail + content column (max 1120px). Single light look by design. */
:root{
  --bg:#FFFFFF; --soft:#F3F5F2; --soft-2:#E9EDE7; --ink:#14211A; --muted:#617066; --line:#E4E8E2;
  --forest:#1F4D36; --forest-2:#2C6A4B; --mint:#DCEBE0; --gold:#B8862E; --gold-t:#F6ECD6; --gold-ink:#7A5714;
  --warn:#A5502C; --warn-t:#F6E1D6;
  --font:'DM Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --r:18px; --ease:cubic-bezier(.25,.46,.45,.94);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(30px,4.6vw,48px);line-height:1.06;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
h2{font-size:clamp(22px,2.6vw,28px);line-height:1.15;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
h3{font-size:16px;font-weight:600;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--forest-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:13.5px}
.xs{font-size:12px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--forest-2)}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;height:62px;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.01em;background:none;border:0;padding:0}
.mark{width:30px;height:30px;border-radius:10px;background:var(--forest);display:grid;place-items:center;color:#fff;flex:none}
.mark svg{width:18px;height:18px}
.brand small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-left:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.cur{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600}
.role-pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:600;border:0}
.role-pill i{width:8px;height:8px;border-radius:50%;background:var(--forest-2)}
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;display:flex;flex-direction:column;gap:2px;padding-block:22px}
.rail button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;border:0;background:none;text-align:left;font-weight:500;color:var(--muted)}
.rail button svg{width:21px;height:21px;flex:none}
.rail button:hover{background:var(--soft);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--mint);color:var(--forest);font-weight:600}
.rail .create{margin-top:14px;background:var(--forest);color:#fff;justify-content:center;font-weight:600}
.rail .create:hover{background:var(--forest-2);color:#fff}
.rail .role-note{margin-top:18px;padding:12px;border-radius:14px;background:var(--soft);font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:24px 72px}
.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;border:0;background:none;font-size:11px;font-weight:500;color:#8A978E}
  .tabbar button svg{width:23px;height:23px}
  .tabbar button[aria-current="page"]{color:var(--forest);font-weight:600}
  .tabbar .plus span{width:50px;height:50px;margin-top:-22px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(31,77,54,.35)}
  .brand small,.top-right .hide-sm{display:none}
}

/* components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;border:0;background:var(--forest);color:#fff;font-weight:600;font-size:15px;transition:background .3s var(--ease)}
.btn:hover{background:var(--forest-2)}
.btn svg{width:19px;height:19px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.mint{background:var(--mint);color:var(--forest)}
.pill.gold{background:var(--gold-t);color:var(--gold-ink)}
.pill.warn{background:var(--warn-t);color:var(--warn)}
.pill.dark{background:rgba(12,20,15,.62);color:#fff}
.pill.white{background:#fff;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.tile{background:var(--soft);border-radius:16px;padding:14px}
.pad{padding:18px}
.stack{display:grid;gap:16px}
.section{display:grid;gap:16px;margin-top:40px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stock{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--forest-2)}
.stock::before{content:"";width:7px;height:7px;border-radius:50%;background:#3DA06A}
.stock.low{color:var(--warn)}
.stock.low::before{background:#D9774A}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.ai{background:linear-gradient(135deg,#1F4D36,#7FBF98)}
.by{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
label.field{display:grid;gap:6px;font-size:13px;font-weight:600}
input[type=text],input[type=number],input[type=tel],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-size:15px}
textarea{resize:vertical;min-height:84px}
.err{color:var(--warn);font-size:12.5px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--soft-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--forest-2)}
.bar i.hot{background:var(--gold)}
.check{width:22px;height:22px;border-radius:50%;background:var(--forest);display:grid;place-items:center;flex:none;color:#fff}
.check svg{width:12px;height:12px}
.ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--forest-2);border-top-color:transparent;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.note{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid3{grid-template-columns:minmax(0,1fr)}.grid2.stack-sm{grid-template-columns:minmax(0,1fr)}}
.photo{position:relative;overflow:hidden;border-radius:var(--r);background:var(--soft)}
.photo img{display:block;width:100%;height:100%;object-fit:cover;max-width:100%}

/* home */
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:440px;display:flex;align-items:flex-end}
.hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 55%;max-width:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,14,10,.78),rgba(8,14,10,.35) 55%,rgba(8,14,10,.05))}
.hero-c{position:relative;z-index:1;padding:clamp(24px,4vw,48px);display:grid;gap:16px;max-width:620px;color:#fff}
.hero-c h1{color:#fff}
.hero-c p{color:rgba(255,255,255,.86);font-size:16.5px;max-width:46ch}
.hero-c .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45)}
.hero-c .btn.light{background:#fff;color:var(--forest)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;padding:16px;border-radius:18px;background:var(--soft);display:grid;gap:6px;align-content:start}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--forest);font-weight:700;font-size:13px}
@media (max-width:980px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.promo{border-radius:22px;padding:22px;display:grid;gap:10px;align-content:start}
.promo.green{background:var(--forest);color:#fff}
.promo.green .muted{color:rgba(255,255,255,.75)}
.promo.gold{background:var(--gold-t)}

/* theme cards */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tcard{border:0;background:none;padding:0;text-align:left;display:grid;gap:8px}
.tcard .photo{aspect-ratio:4/3}
.tcard .photo img{transition:transform .8s var(--ease)}
.tcard:hover .photo img{transform:scale(1.03)}
.tcard .tags{position:absolute;left:10px;top:10px;display:flex;gap:6px}

/* create flow */
.flow-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.stepper li{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--muted)}
.stepper li.on{background:var(--mint);color:var(--forest)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.drop{border:2px dashed var(--soft-2);border-radius:22px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;text-align:center;padding:24px;background:var(--soft);cursor:pointer}
.drop.has{border:0;padding:0;position:relative;overflow:hidden}
.drop.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.scanwrap{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:22px;overflow:hidden;background:#0c1611}
.scanwrap img,.scanwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.scanline{position:absolute;top:0;bottom:0;width:2px;background:#A8E6BD;box-shadow:0 0 18px 4px rgba(168,230,189,.7)}
.cmp{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:22px;overflow:hidden;background:var(--soft)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.cmp .before{clip-path:inset(0 calc(100% - var(--p,50%)) 0 0)}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;z-index:3}
.cmp .handle{position:absolute;top:0;bottom:0;left:var(--p,50%);width:2px;background:#fff;transform:translateX(-1px);z-index:2;pointer-events:none}
.cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.badge{position:absolute;z-index:2;pointer-events:none}
.badge.tl{left:12px;top:12px}.badge.tr{right:12px;top:12px}.badge.bl{left:12px;bottom:12px}
.swap{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.swap::-webkit-scrollbar{display:none}
.swap button{flex:none;width:118px;border:0;background:none;padding:0;text-align:left;display:grid;gap:5px}
.swap .photo{height:96px;border-radius:14px}
.swap button[aria-pressed="true"] .photo{box-shadow:0 0 0 3px var(--forest)}
.swap button[aria-pressed="true"] b{color:var(--forest)}
.swap b{font-size:12.5px;font-weight:600;line-height:1.25}
.lines{width:100%;border-collapse:collapse}
.lines td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.lines td.r{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.lines tr.grp td{padding-top:18px;border-bottom:0;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.pkgs{grid-template-columns:minmax(0,1fr)}}
.pkg{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px;align-content:start}
.pkg[aria-pressed="true"]{border:2px solid var(--forest);padding:13px;background:#FBFDFB}
.pkg b{font-size:15.5px}
.total{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:grid;gap:12px;padding:20px}
.total dl{margin:0;display:grid;gap:8px}
.total dl div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.total dt{color:var(--muted)}
.total dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500}
.total .grand{border-top:1px solid var(--line);padding-top:10px}
.total .grand dd{font-size:24px;font-weight:700}
.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.date{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 2px;display:grid;text-align:center;font-size:11.5px;color:var(--muted)}
.date b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.date[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:rgba(255,255,255,.75)}
.date[aria-pressed="true"] b{color:#fff}
.date:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:520px){.dates{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opt{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;text-align:left;width:100%}
.opt[aria-pressed="true"]{border:2px solid var(--forest);padding:12px}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form2 .full{grid-column:1/-1}
@media (max-width:560px){.form2{grid-template-columns:minmax(0,1fr)}}

/* ===== Landing (white, cinematic) ===== */
body.landing .rail,body.landing .tabbar{display:none}
body.landing .shell{max-width:none;padding:0;display:block}
body.landing main{padding:0}
body.landing .topbar{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);background:transparent;border-bottom-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background .5s var(--ease),border-color .5s var(--ease)}
body.landing .topbar .brand{color:#fff}
body.landing .topbar .brand small{color:rgba(255,255,255,.7)}
body.landing .topbar .role-pill{background:rgba(255,255,255,.16);color:#fff}
body.landing .topbar .cur{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
body.landing .topbar .cur option{color:var(--ink);background:#fff}
body.landing .topbar.solid{background:rgba(255,255,255,.95);border-bottom-color:var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.landing .topbar.solid .brand{color:var(--ink)}
body.landing .topbar.solid .brand small{color:var(--muted)}
body.landing .topbar.solid .role-pill{background:var(--soft);color:var(--ink)}
body.landing .topbar.solid .cur{background:#fff;color:var(--ink);border-color:var(--line)}
body.landing::before{background:transparent}
.open-app{display:none;white-space:nowrap}
.lp-proof{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr);gap:clamp(28px,5vw,80px);align-items:center}
.lp-proof .cmp{border-radius:22px;box-shadow:0 30px 70px rgba(20,33,26,.18)}
.lp-proof .cmp .before{background:#0c1611}
.lp-float{position:absolute;left:14px;bottom:14px;z-index:4;background:rgba(255,255,255,.95);border-radius:16px;padding:12px 14px;display:flex;gap:14px;align-items:flex-end;box-shadow:0 8px 24px rgba(0,0,0,.15);max-width:calc(100% - 28px)}
.lp-float b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:980px){.lp-proof{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.lp-float .btn,.lp-float #lpPlants{display:none}.lp-float{padding:8px 11px;left:10px;bottom:10px}.lp-float b{font-size:17px}}
body.landing .open-app{display:inline-flex}
body.landing .topbar:not(.solid) .open-app{background:#fff;color:var(--forest)}
.lp{overflow-x:hidden}
.lp-wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,5vw,env(safe-area-inset-left,0px));padding-right:max(16px,5vw,env(safe-area-inset-right,0px))}
.lp-block{padding-block:clamp(72px,11vh,128px)}
.lp-scene{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:flex-end;background:#0c1611}
.lp-scene.short{min-height:78vh;min-height:78svh}
.lp-scene .media{position:absolute;left:0;right:0;top:-12%;bottom:-12%;transform:translate3d(0,var(--py,0px),0)}
.lp-scene .media img{width:100%;height:100%;object-fit:cover;max-width:none;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.lp-scene .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,10,.45) 0%,rgba(8,14,10,0) 26%,rgba(8,14,10,.08) 50%,rgba(8,14,10,.78) 100%),linear-gradient(90deg,rgba(8,14,10,.45),rgba(8,14,10,0) 60%)}
.lp-copy{position:relative;z-index:1;width:100%;padding-bottom:clamp(64px,12vh,120px);display:grid;gap:18px;justify-items:start;color:#fff}
.lp-copy h1{color:#fff;font-size:clamp(42px,6.6vw,88px);font-weight:500;letter-spacing:-.03em;max-width:13ch}
.lp-copy h2{color:#fff;font-size:clamp(32px,4.6vw,60px);font-weight:500;letter-spacing:-.025em;max-width:16ch}
.lp-copy p{color:rgba(255,255,255,.86);font-size:17px;max-width:44ch}
.lp-copy .lbl{font-size:11.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#CFEBD8}
.lp-copy .btn.light{background:#fff;color:var(--forest)}
.lp-copy .btn.line{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.lp-copy .btn.line:hover{background:rgba(255,255,255,.12)}
.lp-link{background:none;border:0;padding:4px 0;color:#fff;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;position:relative}
.lp-link::after{content:"";position:absolute;left:50%;bottom:-3px;width:0;height:1px;background:currentColor;transition:width .5s var(--ease),left .5s var(--ease)}
.lp-link:hover::after{width:100%;left:0}
.lp-link.dark{color:var(--forest)}
.scroll-cue{position:absolute;z-index:1;bottom:24px;left:50%;width:1px;height:48px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));animation:cue 2.6s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translateX(-50%) translateY(0);opacity:.35}50%{transform:translateX(-50%) translateY(8px);opacity:.8}}
.lp-in > *{animation:rise 1s var(--ease) both}
.lp-in > :nth-child(1){animation-delay:.2s}.lp-in > :nth-child(2){animation-delay:.4s}.lp-in > :nth-child(3){animation-delay:.6s}.lp-in > :nth-child(4){animation-delay:.8s}
@keyframes rise{from{opacity:.3;transform:translateY(24px)}to{opacity:1;transform:none}}
.rv{transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.rv.pre{opacity:0;transform:translateY(36px)}
.lp-statement{font-size:clamp(28px,3.8vw,50px);line-height:1.12;font-weight:500;letter-spacing:-.025em;max-width:22ch;text-wrap:balance}
.lp-statement em{font-style:normal;color:var(--forest-2)}
.lp-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,44px);margin-top:clamp(36px,6vh,64px)}
.lp-3 > div{border-top:1px solid var(--line);padding-top:20px;display:grid;gap:8px;align-content:start}
.lp-3 h3{font-size:20px;font-weight:600}
.lp-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(14px,2vw,28px);list-style:none;margin:0;padding:0}
.lp-steps li{display:grid;gap:10px;align-content:start}
.lp-steps .n{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--muted)}
.lp-steps .ph{aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--soft)}
.lp-steps .ph img{width:100%;height:100%;object-fit:cover;max-width:none;display:block}
.lp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:clamp(28px,5vh,48px)}
.lp-head h2{font-size:clamp(30px,4vw,52px);font-weight:500;letter-spacing:-.025em;max-width:18ch}
.lp-edit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.ecard{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;border:0;padding:0;background:var(--soft);text-align:left;color:#fff}
.ecard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;transition:transform .9s var(--ease)}
.ecard:hover img{transform:scale(1.04)}
.ecard .c{position:absolute;left:0;right:0;bottom:0;padding:clamp(16px,2vw,26px);display:grid;gap:6px;background:linear-gradient(to top,rgba(6,10,8,.85),rgba(6,10,8,0));padding-top:110px}
.ecard h3{font-size:19px;font-weight:600;color:#fff}
.ecard .by{color:rgba(255,255,255,.82)}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:c}
.chain > div{padding:22px clamp(14px,2vw,26px);border-left:1px solid var(--line);display:grid;gap:8px;align-content:start}
.chain > div:first-child{border-left:0;padding-left:0}
.chain .k{font-size:clamp(34px,4vw,52px);font-weight:500;letter-spacing:-.03em;color:var(--forest);line-height:1}
.pk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:clamp(36px,6vh,56px)}
.pk{border:1px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:10px;align-content:start}
.pk.on{border:2px solid var(--forest);padding:23px}
.pk .price{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.lp-duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lp-duo > div{position:relative;border-radius:26px;overflow:hidden;min-height:420px;display:flex;align-items:flex-end;color:#fff}
.lp-duo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.lp-duo .c{position:relative;z-index:1;padding:clamp(22px,3vw,34px);display:grid;gap:10px;justify-items:start;background:linear-gradient(to top,rgba(6,10,8,.85),rgba(6,10,8,0));width:100%;padding-top:140px}
.lp-duo h2{color:#fff}
.lp-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:20px 28px;align-items:end}
.lp-form label{display:grid;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lp-form input,.lp-form select{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;font-size:17px;background:transparent;letter-spacing:0;text-transform:none;color:var(--ink)}
.lp-form input:focus,.lp-form select:focus{outline:none;border-bottom-color:var(--forest)}
.lp-foot{border-top:1px solid var(--line);padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
@media (max-width:980px){.lp-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.lp-edit{grid-template-columns:repeat(2,minmax(0,1fr))}.chain{grid-template-columns:repeat(2,minmax(0,1fr))}.chain > div:nth-child(3){border-left:0;padding-left:0}.pk3,.lp-duo{grid-template-columns:minmax(0,1fr)}.lp-form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.lp-3{grid-template-columns:minmax(0,1fr)}.lp-steps{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.lp-form{grid-template-columns:minmax(0,1fr)}body.landing .role-pill{display:none}}
@media (prefers-reduced-motion:reduce){.lp-scene .media img,.scroll-cue,.lp-in > *{animation:none}.rv.pre{opacity:1;transform:none}}
/* modal sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,18,13,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}
.sheet-bg.open{opacity:1;visibility:visible}
.sheet{width:min(720px,100%);max-height:calc(100% - 40px);overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .4s var(--ease)}
.sheet-bg.open .sheet{transform:none}
@media (min-width:900px){.sheet-bg{align-items:center}.sheet{border-radius:26px;max-height:88vh}}
.sheet-img{position:relative;aspect-ratio:16/10;max-width:100%}
.sheet-img img{width:100%;height:100%;object-fit:cover;max-width:none;display:block}
.sheet-x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;line-height:1;z-index:2}
.sheet-c{padding:20px;display:grid;gap:16px}

/* dashboards */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis .tile b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.earn{border-radius:22px;background:var(--forest);color:#fff;padding:22px;display:grid;gap:4px}
.earn b{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.earn span{color:rgba(255,255,255,.75);font-size:13px}
.rowi{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rowi:last-child{border-bottom:0}
.rowi .photo{width:58px;height:58px;border-radius:14px;flex:none}
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.track li{display:grid;gap:3px;align-content:start;font-size:12.5px;padding-top:10px;border-top:3px solid var(--line)}
.track li.done{border-top-color:var(--forest-2)}
.track li.now{border-top-color:var(--gold)}
@media (max-width:560px){.track{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===================== Rolls-Royce reference, white ground =====================
   Layout: cinematic full-bleed photo sections on the landing; app pages are open white editorial columns.
   No accent colour in the UI: colour comes only from photography. Light, letter-spaced type. Slow easing. */
:root{
  --ink:#1B1E1C; --muted:#7B807C; --line:#EAEBE8; --soft:#F7F7F5; --soft-2:#E6E7E3;
  --forest:#1B1E1C; --forest-2:#3B403D; --mint:#F2F2EF; --gold:#1B1E1C; --gold-t:#F7F7F5; --gold-ink:#1B1E1C;
  --warn:#8A5A3A; --warn-t:#F5EFEA;
  --ease:cubic-bezier(.25,.46,.45,.94); --ease-h:cubic-bezier(.215,.61,.355,1);
  --font:'DM Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
body{font-weight:300;line-height:1.7;letter-spacing:.005em}
h1,h2{font-weight:300;letter-spacing:.005em;line-height:1.08}
h1{font-size:clamp(34px,4.8vw,62px)}
h2{font-size:clamp(24px,2.8vw,36px)}
h3{font-weight:400;letter-spacing:.02em}
b,strong{font-weight:500}
.eyebrow,.rr-label{font-size:10.5px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:12px;letter-spacing:.02em}
main{padding-block:clamp(40px,7vh,72px) 96px}
.section{margin-top:clamp(56px,9vh,96px)}

/* nav */
.shell{grid-template-columns:minmax(0,1fr);max-width:1240px;padding-left:max(16px,5vw,env(safe-area-inset-left,0px));padding-right:max(16px,5vw,env(safe-area-inset-right,0px))}
.rail,.tabbar{display:none!important}
@media (max-width:900px){main{padding-bottom:72px}}
.topbar{background:rgba(255,255,255,.88);border-bottom:1px solid transparent;transition:background .5s var(--ease),border-color .5s var(--ease)}
.topbar.solid{border-bottom-color:var(--line)}
.topbar-in{max-width:none;height:72px;gap:28px;padding-left:max(16px,5vw,env(safe-area-inset-left,0px));padding-right:max(16px,5vw,env(safe-area-inset-right,0px))}
.brand{font-size:12.5px;font-weight:400;letter-spacing:.34em;text-transform:uppercase;gap:12px;color:var(--ink)}
.brand .mark{width:26px;height:26px;border-radius:0;background:transparent;color:var(--ink)}
.brand .mark svg{width:20px;height:20px}
.topnav{display:flex;gap:30px;margin-left:24px}
.top-right{gap:22px}
.rr-link,.nav-cta{background:none;border:0;padding:4px 0;font-size:11px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);position:relative;transition:color .5s var(--ease-h);white-space:nowrap}
.rr-link::after,.nav-cta::after{content:"";position:absolute;left:50%;bottom:-4px;width:0;height:1px;background:currentColor;transition:width .5s var(--ease),left .5s var(--ease)}
.rr-link:hover,.nav-cta:hover,.rr-link[aria-current="page"],.rr-link.on{color:var(--ink)}
.rr-link:hover::after,.nav-cta:hover::after,.rr-link[aria-current="page"]::after,.rr-link.on::after{width:100%;left:0}
.nav-cta{color:var(--ink)}
.cur{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 2px;font-size:11px;font-weight:400;letter-spacing:.18em;color:var(--muted)}
.burger{display:grid;gap:7px;width:30px;height:30px;align-content:center;justify-items:end;background:none;border:0;padding:0}
.burger span{display:block;height:1px;width:24px;background:var(--ink);transition:width .5s var(--ease)}
.burger span:last-child{width:15px}
.burger:hover span:last-child{width:24px}
@media (max-width:1060px){.topnav{display:none}}
@media (max-width:560px){.nav-cta{display:none}.top-right{gap:16px}.brand{letter-spacing:.24em}}
.open-app{display:none!important}
.menu-ov{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility .6s var(--ease);padding:calc(env(safe-area-inset-top,0px) + 80px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);overflow:auto}
.menu-ov.open{opacity:1;visibility:visible}
.menu-in{display:grid;gap:44px;justify-items:center}
.menu-list{display:grid;justify-items:center;gap:2px}
.menu-item{background:none;border:0;font-family:var(--font);font-size:clamp(28px,4vw,40px);font-weight:200;letter-spacing:.06em;color:var(--muted);padding:8px 16px;opacity:0;transform:translateY(16px);transition:color .5s var(--ease-h),opacity .8s var(--ease) calc(var(--i) * .08s + .15s),transform .8s var(--ease) calc(var(--i) * .08s + .15s)}
.menu-ov.open .menu-item{opacity:1;transform:none}
.menu-item:hover,.menu-item[aria-current="page"]{color:var(--ink)}
.menu-roles{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center}
.menu-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 26px);right:max(16px,5vw,env(safe-area-inset-right,0px))}
body.menu-open{overflow:hidden}

/* buttons, chips, labels */
.btn{min-height:52px;padding:0 34px;border-radius:0;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:11px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;transition:background .5s var(--ease-h),color .5s var(--ease-h),border-color .5s var(--ease-h)}
.btn:hover{background:var(--ink);color:#fff}
.btn svg{width:16px;height:16px}
.btn.ghost,.btn.soft{border-color:var(--line);color:var(--muted);background:transparent}
.btn.ghost:hover,.btn.soft:hover{border-color:var(--ink);color:var(--ink);background:transparent}
.btn.gold{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.gold:hover{background:var(--ink);color:#fff}
.btn.sm{min-height:42px;padding:0 22px;font-size:10.5px;border-radius:0}
.btn[disabled]:hover{background:transparent;color:var(--ink)}
.chips{gap:4px 24px}
.chip{height:34px;padding:0;border:0;border-bottom:1px solid transparent;border-radius:0;background:none;font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:color .5s var(--ease-h),border-color .5s var(--ease-h)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:none;color:var(--ink);border-bottom-color:var(--ink)}
.pill{height:auto;padding:0;border-radius:0;background:none;font-size:10px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.pill.mint,.pill.gold,.pill.warn{background:none;color:var(--ink)}
.pill.dark{background:rgba(14,18,16,.5);color:rgba(255,255,255,.92);padding:6px 10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pill.white{background:rgba(255,255,255,.92);color:var(--ink);padding:5px 9px}
.stock{font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stock::before{background:var(--ink);width:5px;height:5px}
.stock.low{color:var(--warn)}
.stock.low::before{background:var(--warn)}
.err{color:var(--warn);font-weight:400}

/* surfaces: no boxes, hairlines only */
.card{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.card.pad,.pad{padding:24px 0 0}
.tile{background:transparent;border-radius:0;border-top:1px solid var(--line);padding:16px 0 0}
.photo{border-radius:0}
.drop{border:1px solid var(--line);border-radius:0;background:var(--soft)}
.drop .mark{border-radius:0!important;background:transparent!important;color:var(--ink)!important}
.scanwrap,.cmp{border-radius:0}
input[type=text],input[type=number],input[type=tel],input[type=search],select,textarea{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;background:transparent;font-weight:300;transition:border-color .4s var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
textarea{border:1px solid var(--line);padding:12px}
label.field{font-size:10.5px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.av,.av.ai{background:var(--ink)!important;border-radius:50%}
.by{font-size:12px;letter-spacing:.02em}
.check{background:var(--ink)}
.ring{border-width:1px;border-color:#C9CBC7}
.spin{border-width:1px;border-color:var(--ink);border-top-color:transparent}
.bar{height:2px;background:var(--line)}
.bar i{background:var(--ink)}
.bar i.hot{background:#9A7348}
.lines td{border-bottom-color:var(--line);font-weight:300}
.lines tr.grp td{font-size:10px;font-weight:400;letter-spacing:.28em;color:var(--muted)}
.lines td.r{font-weight:400}

/* themes */
.tgrid{gap:44px 24px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tcard{gap:10px}
.tcard .photo{aspect-ratio:3/4}
.tcard b{font-weight:400!important;font-size:17px!important;letter-spacing:.01em}
.tcard .tags{left:12px;top:12px}
.sheet-bg{background:rgba(27,30,28,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .6s var(--ease),visibility .6s}
.sheet{border-radius:0;transition:transform .7s var(--ease)}
@media (min-width:900px){.sheet{border-radius:0}}
.sheet-x{border-radius:0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;width:auto;height:auto;padding:8px 12px}
.sheet-c{padding:28px;gap:22px}

/* create flow */
.flow-head{margin-bottom:36px}
.stepper{gap:6px 22px}
.stepper li{background:none;padding:0 0 4px;border-radius:0;font-size:10.5px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#B6B9B5;border-bottom:1px solid transparent}
.stepper li.on{background:none;color:var(--ink);border-bottom-color:var(--ink)}
.two{gap:clamp(28px,4vw,64px)}
.swap{gap:16px}
.swap .photo{height:120px;border-radius:0}
.swap button[aria-pressed="true"] .photo{box-shadow:none;outline:1px solid var(--ink);outline-offset:4px}
.swap b{font-weight:400}
.swap button[aria-pressed="true"] b{color:var(--ink)}
.kpis{gap:24px}
.kpis .tile b{font-size:clamp(26px,3vw,38px);font-weight:200;letter-spacing:-.01em}
.pkgs{gap:24px}
.pkg{border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0 0;background:transparent}
.pkg[aria-pressed="true"]{border:0;border-top:2px solid var(--ink);padding:15px 0 0;background:transparent}
.pkg b{font-weight:400;font-size:18px}
.total{padding:24px 0 0;border:0;border-top:1px solid var(--ink)}
.total .grand dd{font-size:30px;font-weight:200}
.date{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
.date b{font-weight:300}
.date[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.opt{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;background:transparent}
.opt[aria-pressed="true"]{border:0;border-bottom:1px solid var(--ink);padding:16px 0}
.opt .mark{border-radius:0!important;background:transparent!important;color:var(--ink)!important}
.opt b{font-weight:400}

/* dashboards */
.earn{background:transparent;color:var(--ink);border-radius:0;border-top:1px solid var(--ink);padding:20px 0 0}
.earn b{font-size:clamp(40px,5vw,64px);font-weight:200}
.earn span{color:var(--muted)}
.promo,.promo.gold,.promo.green{background:transparent;border-radius:0;border-top:1px solid var(--ink);padding:20px 0 0;color:var(--ink)}
.rowi{border-bottom-color:var(--line)}
.rowi .photo{border-radius:0}
.track li{border-top-width:1px}
.track li.done{border-top-color:var(--ink)}
.track li.now{border-top:2px solid var(--ink)}
.empty{border-top:1px solid var(--line)}
.toast{border-radius:0;background:var(--ink);font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;padding:14px 22px}

/* Shop the Themes */
.shop-hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;overflow:hidden;margin:0 calc(-1 * max(16px,5vw));color:#fff}
.shop-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;animation:kb 18s ease-in-out infinite alternate}
.shop-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,10,.25),rgba(8,14,10,0) 35%,rgba(8,14,10,.78))}
.shop-hero .c{position:relative;z-index:1;padding:0 max(16px,5vw) clamp(36px,7vh,64px);display:grid;gap:14px;max-width:760px}
.shop-hero h1{color:#fff;font-weight:200;font-size:clamp(38px,5.6vw,76px)}
.shop-hero p{color:rgba(255,255,255,.84);max-width:52ch}
.shop-hero .eyebrow{color:rgba(255,255,255,.72)}
.shop-hero .btn{color:#fff;border-color:rgba(255,255,255,.6)}
.shop-hero .btn:hover{background:rgba(255,255,255,.12);color:#fff}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:40px}
.facts > div{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
.facts b{font-weight:200;font-size:clamp(22px,2.4vw,30px)}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.aisles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:56px 28px}
.aisle{display:grid;gap:14px;align-content:start}
.aisle .photo{aspect-ratio:4/3}
.aisle .no{position:absolute;left:0;top:0;background:#fff;color:var(--ink);padding:8px 12px;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase}
.aisle .meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;border-top:1px solid var(--line);padding-top:14px}
.aisle .price{font-size:30px;font-weight:200;font-variant-numeric:tabular-nums;line-height:1.1}
.qr{width:92px;height:92px;display:grid;place-items:center;border:1px solid var(--line);padding:6px;background:#fff;font-size:9px;letter-spacing:.14em;text-align:center;color:var(--muted)}
.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
.sign{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border:1px solid var(--line);padding:16px;background:#fff}
.sign .qr{width:120px;height:120px}
/* reveals on every page */
.rv{transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.rv.pre{opacity:0;transform:translateY(32px)}

/* landing on white */
body.landing .topbar{background:transparent;border-bottom-color:transparent}
body.landing .topbar:not(.solid) .brand,body.landing .topbar:not(.solid) .rr-link,body.landing .topbar:not(.solid) .nav-cta,body.landing .topbar:not(.solid) .cur{color:rgba(255,255,255,.9)}
body.landing .topbar:not(.solid) .brand .mark{color:#fff}
body.landing .topbar:not(.solid) .burger span{background:#fff}
body.landing .topbar:not(.solid) .cur{border-bottom-color:rgba(255,255,255,.35);background:transparent}
body.landing .topbar.solid{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom-color:var(--line)}
.lp-copy h1{font-weight:200;letter-spacing:.01em;font-size:clamp(44px,6.6vw,92px)}
.lp-copy h2{font-weight:200;letter-spacing:.01em}
.lp-copy p{font-weight:300;line-height:1.7;color:rgba(255,255,255,.82)}
.lp-copy .lbl{font-weight:400;letter-spacing:.32em;color:rgba(255,255,255,.72)}
.lp-copy .btn,.lp-copy .btn.light{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.lp-copy .btn:hover,.lp-copy .btn.light:hover{background:rgba(255,255,255,.12);border-color:#fff;color:#fff}
.lp-copy .btn.line{border:0;padding:0;min-height:0;letter-spacing:.26em;position:relative}
.lp-copy .btn.line::after{content:"";position:absolute;left:50%;bottom:-6px;width:0;height:1px;background:#fff;transition:width .5s var(--ease),left .5s var(--ease)}
.lp-copy .btn.line:hover{background:transparent}
.lp-copy .btn.line:hover::after{width:100%;left:0}
.lp-link{font-weight:400;letter-spacing:.28em}
.lp-statement{font-weight:200;letter-spacing:.005em;line-height:1.15}
.lp-statement em{color:var(--muted)}
.lp-3 h3,.lp-steps h3,.chain h3,.pk h3{font-weight:400}
.lp-head h2{font-weight:200;letter-spacing:.005em}
.lp-steps .ph{border-radius:0}
.lp-steps .n{font-weight:400;letter-spacing:.3em}
.lp-edit{gap:2px}
.ecard h3{font-weight:300;font-size:22px;letter-spacing:.03em}
.chain .k{font-weight:200;color:var(--ink)}
.pk{border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0 0}
.pk.on{border:0;border-top:1px solid var(--ink);padding:22px 0 0}
.pk .price{font-weight:200;font-size:34px}
.lp-duo{gap:2px}
.lp-duo > div{border-radius:0}
.lp-duo h2{font-weight:200}
.lp-duo .btn{background:transparent!important;color:#fff!important;border-color:rgba(255,255,255,.6)!important}
.lp-duo .btn:hover{background:rgba(255,255,255,.12)!important}
.lp-duo .eyebrow{color:rgba(255,255,255,.72)!important}
.lp-form label{font-weight:400;letter-spacing:.26em}
.lp-form input,.lp-form select{font-weight:300}
.lp-proof .cmp{border-radius:0;box-shadow:0 40px 90px rgba(27,30,28,.16)}
.lp-float{border-radius:0;background:rgba(255,255,255,.94);box-shadow:none;padding:14px 16px}
.lp-float b{font-weight:200;font-size:26px}
.lp-foot{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.rv.pre{opacity:1;transform:none}.menu-item{opacity:1;transform:none}}

/* ===================== White ground everywhere =====================
   Photos stay clean (no dark overlays); every line of text sits on white.
   Rolls-Royce type, buttons and motion are unchanged. */
body.landing .topbar,body.landing .topbar:not(.solid){background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom-color:var(--line)}
body.landing .topbar:not(.solid) .brand,body.landing .topbar:not(.solid) .rr-link,body.landing .topbar:not(.solid) .cur{color:var(--muted)}

body.landing .topbar:not(.solid) .brand .mark{color:var(--ink)}

body.landing .topbar:not(.solid) .cur{border-bottom-color:var(--line)}
body.landing main{padding-top:72px}
/* full-bleed scenes: clean photo, text on white below */
.lp-scene,.lp-scene.short{display:flex;flex-direction:column;align-items:stretch;min-height:0;background:#fff}
.lp-scene .media{position:relative;inset:auto;top:auto;bottom:auto;height:min(78vh,820px);overflow:hidden;transform:none!important}
.lp-scene .shade,.scroll-cue{display:none}
.lp-scene .lp-copy{color:var(--ink);padding-block:clamp(36px,6vh,64px) clamp(56px,10vh,110px)}
.lp-scene .lp-copy h1,.lp-scene .lp-copy h2{color:var(--ink);text-shadow:none}
.lp-scene .lp-copy p{color:var(--muted)}
.lp-scene .lp-copy .lbl{color:var(--muted)}
.lp-scene .lp-copy .btn,.lp-scene .lp-copy .btn.light{color:var(--ink);border-color:var(--ink);background:transparent}
.lp-scene .lp-copy .btn:hover,.lp-scene .lp-copy .btn.light:hover{background:var(--ink);color:#fff}
.lp-scene .lp-copy .btn.line{color:var(--ink);border:0}

.lp-scene .lp-link{color:var(--ink)}
/* hero: headline first, photo after */
.lp > .lp-scene:first-child .lp-wrap{order:0}
.lp > .lp-scene:first-child .media{order:1;height:min(70vh,760px)}
.lp > .lp-scene:first-child .lp-copy{padding-block:clamp(56px,10vh,110px) clamp(36px,6vh,64px)}
/* marketplace cards: caption below the photo */
.ecard{aspect-ratio:auto;display:grid;align-content:start;background:#fff;color:var(--ink)}
.ecard img{position:relative;inset:auto;height:auto;aspect-ratio:3/4}
.ecard .c{position:static;background:none;padding:16px 4px 8px;gap:6px}
.ecard h3{color:var(--ink)}
.ecard .by{color:var(--muted)}
.ecard .c .xs{color:var(--muted)!important}
/* request / designer cards */
.lp-duo > div{display:block;min-height:0;color:var(--ink);background:#fff}
.lp-duo img{position:relative;inset:auto;height:auto;aspect-ratio:16/10}
.lp-duo .c{position:static;background:none;padding:22px 0 0;width:auto}
.lp-duo h2{color:var(--ink)}
.lp-duo .c p{color:var(--muted)!important}
.lp-duo .eyebrow{color:var(--muted)!important}
.lp-duo .btn{background:transparent!important;color:var(--ink)!important;border-color:var(--ink)!important}
.lp-duo .btn:hover{background:var(--ink)!important;color:#fff!important}
/* Shop the Themes and Nursery headers */
.shop-hero{display:block;min-height:0!important;color:var(--ink)}
.shop-hero::after{display:none}
.shop-hero img{position:relative;inset:auto;height:min(60vh,640px)}
.shop-hero .c{padding:clamp(28px,5vh,48px) max(16px,5vw) 0}
.shop-hero h1{color:var(--ink)}
.shop-hero p{color:var(--muted)}
.shop-hero .eyebrow{color:var(--muted)}
.shop-hero .btn{color:var(--ink);border-color:var(--ink)}
.shop-hero .btn:hover{background:var(--ink);color:#fff}

/* ===== Review fixes (Oct 2026) ===== */
/* 1, 2, 12: modal is opaque, Close is pinned, header hidden while open */
.sheet-bg{z-index:90}
.sheet{background:#fff!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;opacity:1!important;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 12px);overscroll-behavior:contain}

.sheet-close{min-height:44px;padding:0 14px;border:1px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center}

function quote(themeId, area, pkg){

function runGenerate(){
  clearTimeout(genTimer);
  const cv = $('#scanCv'), wrap = $('#scanwrap'); if (!cv || !wrap) return;
  const img = new Image();
  img.onload = () => {
    const W = 480, H = Math.round(W * 0.75); cv.width = W; cv.height = H;
    const c = cv.getContext('2d'); const s = Math.max(W / img.width, H / img.height); c.drawImage(img, (W - img.width * s) / 2, (H - img.height * s) / 2, img.width * s, img.height * s);
    try {
      const d = c.getImageData(0, 0, W, H), g = new Float32Array(W * H), o = c.createImageData(W, H);
      for (let i = 0; i < W * H; i++) g[i] = d.data[i * 4] * .3 + d.data[i * 4 + 1] * .59 + d.data[i * 4 + 2] * .11;
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){ const i = y * W + x; const gx = -g[i - W - 1] - 2 * g[i - 1] - g[i + W - 1] + g[i - W + 1] + 2 * g[i + 1] + g[i + W + 1]; const gy = -g[i - W - 1] - 2 * g[i - W] - g[i - W + 1] + g[i + W - 1] + 2 * g[i + W] + g[i + W + 1]; const m = Math.min(1, Math.hypot(gx, gy) / 260); o.data[i * 4] = 12 + m * 156; o.data[i * 4 + 1] = 22 + m * 208; o.data[i * 4 + 2] = 17 + m * 172; o.data[i * 4 + 3] = 255; }
      c.putImageData(o, 0, 0);
    } catch(e){}
  };
  img.src = S.photo;
  const steps = $$('[data-gs]'), bar = $('#genBar'), line = $('#scanLine');
  let t0 = performance.now(); const dur = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 3600;
  const tick = now => {
    if (S.screen !== 'create' || S.flow.step !== 2) return;
    const k = Math.min(1, (now - t0) / dur), pct = Math.round(k * 100);
    if (bar) bar.style.width = pct + '%';
    if (line) line.style.left = pct + '%';
    if (cv) cv.style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';
    steps.forEach((el, i) => { const done = k >= (i + 1) / 4, now2 = !done && k >= i / 4; const ic = el.firstElementChild; ic.className = done ? 'check' : now2 ? 'spin' : 'ring'; ic.innerHTML = done ? icon('ok') : ''; });
    if (k < 1) requestAnimationFrame(tick); else genTimer = setTimeout(() => { S.flow.step = 3; save(); render(); toast('Design ready. Swap themes to compare.'); }, 500);
  };
  requestAnimationFrame(tick);
}

function measArea(){
  const m = S.meas, A = S.photoAR || 0.75, p = m.pts.map(([x, y]) => [x, y * A]);
  let sh = 0; for (let i = 0; i < 4; i++){ const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % 4]; sh += x1 * y2 - x2 * y1; }
  const front = Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]), back = Math.hypot(p[2][0] - p[3][0], p[2][1] - p[3][1]) || front;

  const persp = Math.min(3, Math.max(1, (1 + front / back) / 2));
  return Math.max(1, Math.round(Math.abs(sh) / 2 * Math.pow(m.edge / front, 2) * persp));
}

const EDGE = {};
function edgeURL(src, cb){
  if (EDGE[src]) return cb(EDGE[src]);
  const img = new Image();
  img.onload = () => {
    const W = 720, H = Math.round(W * img.height / img.width), c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
    try {
      const d = x.getImageData(0, 0, W, H), g = new Float32Array(W * H), o = x.createImageData(W, H);
      for (let i = 0; i < W * H; i++) g[i] = d.data[i * 4] * .3 + d.data[i * 4 + 1] * .59 + d.data[i * 4 + 2] * .11;
      for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++){ const i = y * W + xx; const gx = -g[i - W - 1] - 2 * g[i - 1] - g[i + W - 1] + g[i - W + 1] + 2 * g[i + 1] + g[i + W + 1]; const gy = -g[i - W - 1] - 2 * g[i - W] - g[i - W + 1] + g[i + W - 1] + 2 * g[i + W] + g[i + W + 1]; const m = Math.min(1, Math.hypot(gx, gy) / 240); o.data[i * 4] = 12 + m * 156; o.data[i * 4 + 1] = 22 + m * 208; o.data[i * 4 + 2] = 17 + m * 172; o.data[i * 4 + 3] = 255; }
      x.putImageData(o, 0, 0);
      EDGE[src] = c.toDataURL('image/jpeg', 0.8);
    } catch(e){ EDGE[src] = ''; }
    cb(EDGE[src]);
  };
  img.onerror = () => cb('');
  img.src = src;
}

function setupReveal(){
  if (lpIO){ lpIO.disconnect(); lpIO = null; }
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (S.screen !== 'home'){
    const cand = $$('#view > *, #view .two > *, #view .tgrid > *, #view .kpis > *, #view .grid2 > *, #view .pkgs > *, #view .lines tr, #view .card .rowi');
    const set = new Set(cand), els = cand.filter(el => { for (let p = el.parentElement; p && p.id !== 'view'; p = p.parentElement){ if (set.has(p) && !p.matches('.two > *, .card, table, tbody')) return false; } return true; });
    let k = 0; els.forEach(el => { el.classList.add('rv'); el.style.setProperty('--d', Math.min(0.6, (k++) * 0.06).toFixed(2) + 's'); });
  }
  if (reduce || !('IntersectionObserver' in window)) return;
  const vh = window.innerHeight;
  lpIO = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.remove('pre'); lpIO.unobserve(en.target); } }), { threshold: 0.12 });
  $$('#view .rv').forEach(el => { const top = el.getBoundingClientRect().top; if (top > vh * 0.92){ el.classList.add('pre'); lpIO.observe(el); } else if (S.screen !== 'home'){ el.classList.add('pre'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('pre'))); } });
}

function payStats(){
  const inv = allInvoices(), today = todayISO(), paid = inv.filter(x => x.paidAt), open = inv.filter(x => x.issued && !x.paidAt);
  const months = []; for (let i = 5; i >= 0; i--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push({ k: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), l: d.toLocaleDateString('en-GB', { month:'short' }), v:0 }); }
  paid.forEach(x => { const m = months.find(m => x.paidAt.startsWith(m.k)); if (m) m.v += x.amount; });
  const collected = paid.reduce((s, x) => s + x.amount, 0), c90 = paid.filter(x => daysBetween(x.paidAt, today) <= 90).reduce((s, x) => s + x.amount, 0);
  const outstanding = open.reduce((s, x) => s + x.amount, 0), overdue = open.filter(x => x.due < today).reduce((s, x) => s + x.amount, 0);
  const issued = inv.filter(x => x.issued), rate = issued.length ? paid.length / issued.length : 0;
  const dtp = paid.length ? paid.reduce((s, x) => s + daysBetween(x.issued, x.paidAt), 0) / paid.length : 0;
  const custs = {}; allOrders().forEach(o => { const c = o.customer || 'Guest'; custs[c] = (custs[c] || 0) + 1; });
  const payers = new Set(paid.map(x => x.customer)).size, repeat = Object.values(custs).filter(n => n > 1).length;
  const byTheme = {}; paid.forEach(x => { const o = orderOf(x.orderId); if (o) byTheme[o.themeId] = (byTheme[o.themeId] || 0) + x.amount; });
  const avg = allOrders().reduce((s, o) => s + o.total, 0) / Math.max(1, allOrders().length);
  return { inv, paid, open, months, collected, c90, outstanding, overdue, rate, dtp, payers, repeat, byTheme, avg, customers:Object.keys(custs).length };
}

function readImage(file, max, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); let u = r.result; try { u = c.toDataURL('image/jpeg', 0.82); } catch(e){} cb(u, img.height / img.width); }; img.onerror = () => toast('That file could not be opened. Try a JPG or PNG photo.'); img.src = r.result; };
  r.readAsDataURL(file);
}

function bestThemeFor(brief, maxUSD, area){
  const b = (brief || '').toLowerCase();
  const score = t => { let s = 0; if (/shade|shady|cool/.test(b) && t.tags.includes('Shade')) s += 3; if (/native|coast|salt|wind|low water/.test(b) && t.tags.includes('Native')) s += 3; if (/tropical|palm|lush/.test(b) && t.tags.includes('Tropical')) s += 3; if (/roof|balcony|courtyard|small/.test(b) && (t.tags.includes('Rooftop') || t.tags.includes('Courtyard'))) s += 2; if (/resort|hotel/.test(b) && t.tags.includes('Resort')) s += 2; if (quote(t.id, area, 'essential').total <= maxUSD) s += 2; return s; };
  return themes().filter(t => t.by === 'ai').concat(themes()).sort((a, b) => score(b) - score(a))[0];
}
