    case 'bAdd': S.bForm = null; render(); $('#bForm').scrollIntoView({ behavior:'smooth' }); setTimeout(() => { const i = $('[data-bf="name"]'); if (i) i.focus({ preventScroll:true }); }, 500); break;
    case 'survey': if (!S.user){ openAuth({ act:'survey' }, 'Sign in to request a survey. Quotes, contracts and invoices for your buildings are kept in your account.'); break; } submitSurvey(); break;
    case 'villa': if (a.dataset.id) S.villaPick = a.dataset.id; S.villaN = 'Villa 01'; openSheet(villaSheet()); break;
    case 'villaPick': S.villaPick = a.dataset.id; openSheet(villaSheet()); break;
    case 'villaOrder': { if (!S.user){ openAuth({ act:'villa' }, 'Sign in to order your villa garden.'); break; } const id = S.villaPick, q = quote(id, 180, 'essential'), plants = {}; q.lines.filter(l => l.g === 'plants').forEach(l => plants[l.id] = l.qty); const o = { id:'TS-' + String(Date.now()).slice(-5), themeId:id, area:180, pkg:'essential', total:q.total, plants, crew:'c1', date:iso(firstOpen(days())), slot:'8:00 AM', status:'Booked', created:todayISO(), by:q.t.by, src:'villa', villa:$('#vVilla').value, payPlan:S.payPlan }; addOrder(o); if (S.role === 'developer') render(); openSheet(confirmSheet(o)); break; }
    case 'aisleOrder': S.soDate = null; openSheet(aisleSheet(a.dataset.id)); break;
    case 'measure': { if (a.dataset.ret){ const v = Math.round(+(($('#soArea') || {}).value) || 0); S.returnAisle = a.dataset.ret; } else S.returnAisle = null; if (S.photo) openSheet(measureSheet()); else { S.measurePending = true; $('#photoIn').click(); } break; }
    case 'measPhoto': S.measurePending = true; $('#photoIn').click(); break;
    case 'measUse': { const ar = measArea(); if (!ar){ toast('Enter the front edge length in metres.'); return; } f.area = ar; f.measured = true; S.shopArea = ar; save(); if (S.returnAisle){ const r = S.returnAisle; S.returnAisle = null; openSheet(aisleSheet(r)); } else { closeSheet(); render(); } toast('Area set to ' + ar + ' m², measured from your photo'); break; }
    case 'soDate': S.soDate = a.dataset.d; $$('[data-act="soDate"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === S.soDate)); break;
    case 'soPlace': {
      const id = a.dataset.id, area = Math.max(5, Math.round(+$('#soArea').value || 0)), nm = $('#soName').value.trim(), ph = $('#soPhone').value.replace(/\D/g, ''), ad = $('#soAddr').value.trim();
      if (!S.user){ S.soDraft = { id, area, nm, ph:$('#soPhone').value, ad }; openAuth({ act:'aisle', id }, 'Sign in to order. Your order, invoices and receipts are kept in your account.'); return; }
      if (!S.soDate || !nm || ph.length < 7 || !ad || !area){ $('#soErr').hidden = false; $('#soErr').scrollIntoView({ behavior:'smooth', block:'center' }); return; }
      const q = quote(id, area, 'essential'), plants = {}; q.lines.filter(l => l.g === 'plants').forEach(l => plants[l.id] = l.qty);
      const oid = 'TS-' + String(Date.now()).slice(-5);
      const o = { id:oid, themeId:id, area, pkg:'essential', total:q.total, payPlan:S.payPlan, plants, crew:'c1', date:S.soDate, slot:'8:00 AM', status:'Booked', created:iso(new Date()), by:q.t.by, src:'showroom' };
      addOrder(o); S.soDraft = null; S.shopArea = area; S.role = 'customer'; save(); openSheet(confirmSheet(o)); break; }
    case 'planVisit': S.visitDate = null; S.visitSlot = null; openSheet(visitSheet()); break;
    case 'visitDate': S.visitDate = a.dataset.d; $$('[data-act="visitDate"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === S.visitDate)); break;
    case 'visitSlot': S.visitSlot = a.dataset.s; $$('[data-act="visitSlot"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === S.visitSlot)); break;
    case 'visitBook': { const nm = $('#vName').value.trim(); if (!S.visitDate || !S.visitSlot || !nm){ $('#vErr').hidden = false; return; } closeSheet(); toast('Visit booked for ' + pretty(S.visitDate) + ' at ' + S.visitSlot + '. See you at TERA Park 2.'); break; }
    case 'menuClose': menuOpen(false); break;
    case 'openTheme': openSheet(themeSheet(a.dataset.id)); break;
    case 'closeSheet': closeSheet(); break;
    case 'save': { const i = S.saved.indexOf(a.dataset.id); if (i >= 0) S.saved.splice(i, 1); else S.saved.push(a.dataset.id); save(); openSheet(themeSheet(a.dataset.id)); toast(i >= 0 ? 'Removed from saved' : 'Saved'); break; }
    case 'useTheme': closeSheet(); f.themeId = a.dataset.id; f.step = S.photo ? 3 : 1; save(); S.role = 'customer'; go('create'); toast(S.photo ? 'Showing ' + theme(f.themeId).name + ' on your space' : 'Add a photo of your space to start'); break;
    case 'filter': S.filter = a.dataset.f; $$('[data-act="filter"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === S.filter)); $('#tgrid').innerHTML = themeGrid(); break;
    case 'upload': e.stopPropagation(); $('#photoIn').click(); break;
    case 'themePhoto': $('#themePhotoIn').click(); break;
    case 'ptype': f.type = a.dataset.v; save(); $$('[data-act="ptype"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === f.type)); break;
    case 'generate': if (!S.photo) return; f.step = 2; save(); render(); window.scrollTo(0, 0); break;
    case 'swapTheme': f.themeId = a.dataset.id; save(); render(); toast(theme(f.themeId).name); break;
    case 'toStep': if (+a.dataset.s === 5 && !S.user){ openAuth({ act:'step5' }, 'Sign in to book. Your booking, invoices and receipts are kept in your account.'); break; } f.step = +a.dataset.s; save(); render(); window.scrollTo(0, 0); break;
    case 'pkg': f.pkg = a.dataset.k; save(); render(); break;
    case 'estate': { const n = $('#esName').value.trim(), ha = +$('#esHa').value; if (!n || !ha){ toast('Add the site name and area in hectares.'); return; } toast('Sent. Hoang Lam\'s estate team will prepare a phased plan for ' + n + '.'); f.pkg = 'essential'; save(); render(); break; }
    case 'crew': f.crew = a.dataset.id; save(); render(); break;
    case 'date': f.date = a.dataset.d; save(); $$('.date').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === f.date)); break;
    case 'slot': f.slot = a.dataset.s; save(); $$('[data-act="slot"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === f.slot)); $('#errDate').hidden = true; break;
    case 'placeOrder': {
      const nm = $('#bName').value.trim(), ph = $('#bPhone').value.replace(/\D/g, ''), ad = $('#bAddr').value.trim();
      const okD = f.date && f.slot, okP = nm && ph.length >= 7 && ad;
      $('#errDate').hidden = !!okD; $('#errDet').hidden = !!okP;
      if (!okD || !okP){ (!okD ? $('#errDate') : $('#errDet')).scrollIntoView({ behavior:'smooth', block:'center' }); return; }
      const q = quote(f.themeId, f.area, f.pkg), plants = {}; q.lines.filter(l => l.g === 'plants').forEach(l => plants[l.id] = l.qty);
      const id = 'TS-' + String(Date.now()).slice(-5);
      const o = { id, themeId:f.themeId, area:f.area, pkg:f.pkg, total:q.total, payPlan:S.payPlan, plants, crew:crewOf(f.crew).id, date:f.date, slot:f.slot, status:'Booked', created:iso(new Date()), by:q.t.by };
      addOrder(o);
      f.step = 1; f.date = null; f.slot = null; save(); go('projects'); openSheet(confirmSheet(o));
      break; }
    case 'advance': { const o = S.orders.find(x => x.id === a.dataset.id); if (o){ o.status = STAGES[Math.min(STAGES.length - 1, STAGES.indexOf(o.status) + 1)]; if (o.status === 'Handed over' && !o.planted) o.planted = todayISO(); const inv = S.invoices.filter(x => x.orderId === o.id && !x.kind), k = o.payPlan && o.payPlan !== 'ms' ? -1 : o.status === 'Installing' ? 1 : o.status === 'Handed over' ? 2 : -1; if (k > 0 && inv[k] && !inv[k].issued){ inv[k].issued = todayISO(); inv[k].due = addDays(inv[k].issued, 7); toast(inv[k].label + ' invoice issued'); } save(); render(); } break; }
    case 'sendRequest': {
      const brief = $('#rBrief').value.trim(), area = Math.max(10, +$('#rArea').value || S.flow.area), maxUSD = toUSD(+$('#rMax').value || 0) || 8000;
      if (!brief){ $('#errReq').hidden = false; return; }
      const t = bestThemeFor(brief, maxUSD, area), id = 'R' + Date.now();
      const r = { id, type:S.flow.type, area, brief, maxUSD, photo:S.photo && S.photo.length < 400000 ? S.photo : null, created:iso(new Date()), pending:2, proposals:[{ id:id + 'a', by:'ai', themeId:t.id, priceUSD:quote(t.id, area, 'essential').total, note:'Instant concept matched to your brief' }] };
      S.requests.push(r); S.reqForm.brief = ''; save(); render(); toast('Request sent. Your AI concept is ready.');
      setTimeout(() => { const rr = S.requests.find(x => x.id === id); if (!rr || rr.accepted) return; const t2 = theme('resort-poolside'); rr.proposals.push({ id:id + 'b', by:'d2', themeId:t2.id, priceUSD:Math.round(quote(t2.id, area, 'essential').total * 0.97), note:'Example proposal from a demo designer' }); rr.pending = 1; save(); if (S.screen === 'requests') render(); toast('Marco Reyes (example designer) sent a proposal'); }, 5000);
      break; }
    case 'accept': { const r = S.requests.find(x => x.id === a.dataset.r), p = r && r.proposals.find(x => x.id === a.dataset.p); if (!p) return; r.accepted = p.id; f.themeId = p.themeId; f.area = r.area; f.step = S.photo ? 4 : 1; save(); go('create'); toast('Proposal chosen. ' + (S.photo ? 'Here is your quote.' : 'Add a photo to continue.')); break; }
    case 'propose': { const r = S.requests.find(x => x.id === a.dataset.r); if (!r) return; const tid = $('#pt-' + r.id).value, note = $('#pn-' + r.id).value.trim() || 'Designed for your brief'; r.proposals.push({ id:r.id + 'm' + Date.now(), by:ME_DESIGNER, themeId:tid, priceUSD:quote(tid, r.area, 'essential').total, note }); r.pending = Math.max(0, (r.pending || 0) - 1); save(); render(); toast('Proposal sent to the customer'); break; }
    case 'utag': { const sf = S.studioForm, v = a.dataset.v, i = sf.tags.indexOf(v); if (i >= 0) sf.tags.splice(i, 1); else sf.tags.push(v); a.setAttribute('aria-pressed', i < 0); break; }
    case 'publish': {
      const sf = S.studioForm; sf.name = $('#uName').value.trim(); sf.blurb = $('#uBlurb').value.trim(); sf.ground = $('#uGround').value;
      $$('[data-uplant]').forEach(i => { const v = Math.max(0, Math.round(+i.value || 0)); if (v) sf.plants[i.dataset.uplant] = v; else delete sf.plants[i.dataset.uplant]; });
      const pl = Object.entries(sf.plants);
      if (!sf.name || !sf.img || !pl.length){ $('#errUp').hidden = false; return; }
      const t = { id:'u' + Date.now(), name:sf.name, by:ME_DESIGNER, img:sf.img, tags:sf.tags.length ? sf.tags : ['Home garden'], blurb:sf.blurb || 'New theme', plants:pl, ground:sf.ground, usdM2:91, mine:true };
      S.myThemes.unshift(t); S.studioForm = null; save(); go('studio'); toast('Published. Customers can now find ' + t.name + ' in Themes.'); break; }
    case 'grow': { const p = PLANT[a.dataset.id]; if (p){ const n = +a.dataset.n || 10; toast('Added ' + n.toLocaleString('en-US') + ' ' + p.name.toLowerCase() + ' to the grow plan'); a.disabled = true; a.textContent = 'Added'; } break; }
    case 'role': menuOpen(false); S.role = a.dataset.role; save(); S.screen = HOME_OF[S.role]; render(); window.scrollTo(0, 0); toast('Viewing as ' + ROLE_NAME[S.role]); break;
    case 'resetAsk': $('#resetBox').innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="sm">Clear all demo data in this browser?</span><button class="btn sm" data-act="resetDo">Yes, reset</button><button class="btn ghost sm" data-act="resetNo">Cancel</button></div>'; break;
    case 'resetNo': render(); break;
    case 'resetDo': store.clear(); location.reload(); break;
  }
});
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (document.body.classList.contains('ar-open')){ arClose(); return; } closeSheet(); menuOpen(false); return; }
  const mh = e.target.closest && e.target.closest('.mh');
  if (mh && S.meas && /^Arrow/.test(e.key)){ e.preventDefault(); const p = S.meas.pts[+mh.dataset.mh], st = e.shiftKey ? 0.05 : 0.01; if (e.key === 'ArrowLeft') p[0] = Math.max(0, p[0] - st); if (e.key === 'ArrowRight') p[0] = Math.min(1, p[0] + st); if (e.key === 'ArrowUp') p[1] = Math.max(0, p[1] - st); if (e.key === 'ArrowDown') p[1] = Math.min(1, p[1] + st); measDraw(); return; }
  if (e.key === 'Tab' && document.body.classList.contains('sheet-open')){ const f = $$('#sheet button:not([disabled]), #sheet input, #sheet select, #sheet [tabindex="0"]'); if (f.length){ const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); } } } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.drop[role="button"]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'tq'){ S.q = el.value; $('#tgrid').innerHTML = themeGrid(); }
  if (el.id === 'lpCmpIn'){ S.lpCmp = +el.value; $('#lpCmp').style.setProperty('--p', el.value + '%'); }
  if (el.id === 'cmpIn'){ S.flow.cmp = +el.value; $('#cmp').style.setProperty('--p', el.value + '%'); }
  if (el.id === 'rBrief'){ S.reqForm.brief = el.value; }
  if (el.id === 'soArea'){ const a2 = Math.max(0, +el.value || 0), id = $('[data-act="soPlace"]').dataset.id; if (a2 >= 5){ const q = quote(id, a2, 'essential'); $('#soTotal').innerHTML = money2(q.total); $('#soDep').innerHTML = money2(q.deposit); if ($('#soPlan')) $('#soPlan').innerHTML = payPlanHTML(q.total); const h = el.parentElement.querySelector('.hint'); if (h) h.textContent = 'Typed'; } }
  if (el.dataset && el.dataset.bf && S.bForm){ const k = el.dataset.bf; S.bForm[k] = ['name','city','type','ref'].includes(k) ? el.value : Math.max(0, Math.round(+el.value || 0)); if ($('#bOut')) $('#bOut').innerHTML = bOut(); }
  if (el.id === 'arDist' && AR.st && AR.st.garden){ AR.st.dist = +el.value; AR.st.garden.position.z = -AR.st.dist; }
  if (el.id === 'measEdgeIn' && S.meas){ S.meas.edge = Math.max(0, +el.value || 0); measDraw(); }
});
let mDrag = -1;
document.addEventListener('pointerdown', e => { const h = e.target.closest && e.target.closest('.mh'); if (!h || !S.meas) return; mDrag = +h.dataset.mh; try { h.setPointerCapture(e.pointerId); } catch(_){} e.preventDefault(); });
document.addEventListener('pointermove', e => { if (mDrag < 0) return; const box = $('#meas'); if (!box) return; const r = box.getBoundingClientRect(); S.meas.pts[mDrag] = [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; measDraw(); });
document.addEventListener('pointerup', () => { mDrag = -1; }); document.addEventListener('pointercancel', () => { mDrag = -1; });
document.addEventListener('submit', e => {
  if (e.target.id !== 'lpForm') return;
  e.preventDefault();
  const f = S.flow; f.type = $('#lpType').value; f.area = Math.max(10, Math.round(+$('#lpArea').value || 120)); f.measured = false; f.sun = $('#lpSun').value; f.themeId = $('#lpTheme').value; f.step = S.photo ? 3 : 1; save();
  go('create'); toast(S.photo ? 'Showing ' + theme(f.themeId).name + ' on your space' : 'Add a photo of your space to start');
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'curSel' || el.id === 'curSel2'){ S.cur = el.value; save(); render(); toast('Prices in ' + (CURRENCIES.find(c => c[0] === el.value) || [0, el.value])[1]); return; }
  if (el.id === 'areaIn'){ S.flow.area = Math.max(10, Math.round(+el.value || 120)); S.flow.measured = false; save(); render(); return; }
  if (el.id === 'sunIn'){ S.flow.sun = el.value; save(); return; }
  if (el.id === 'arVidIn' && el.files && el.files[0]){ arStart('video', URL.createObjectURL(el.files[0])); el.value = ''; return; }
  if (el.id === 'docPlant' && S.doc){ S.doc.pid = el.value; return; }
  if (el.id === 'docIn' && el.files && el.files[0]){ const oid = S.doc && S.doc.orderId; readImage(el.files[0], 900, u => { if (!S.doc) return; S.doc.img = u; S.doc.r = null; openSheet(doctorSheet(oid)); diagnose(u, r => { if (S.doc && S.doc.orderId === oid){ S.doc.r = r; openSheet(doctorSheet(oid)); } }); }); el.value = ''; return; }
  if (el.id === 'photoIn' && el.files && el.files[0]){ readImage(el.files[0], 1400, (u, ar) => { S.photo = u; S.photoAR = ar || 0.75; S.meas = null; const inSheet = S.measurePending || document.body.classList.contains('sheet-open'); S.measurePending = false; if (inSheet || S.screen === 'create'){ if (S.screen === 'create') render(); openSheet(measureSheet()); toast('Photo added. Outline the area to measure it.'); } else { render(); toast('Photo added'); } }); el.value = ''; return; }
  if (el.id === 'themePhotoIn' && el.files && el.files[0]){ readImage(el.files[0], 1000, u => { S.studioForm.img = u; S.studioForm.name = ($('#uName') || {}).value || S.studioForm.name; S.studioForm.blurb = ($('#uBlurb') || {}).value || S.studioForm.blurb; render(); }); el.value = ''; return; }
});

if (S.flow.step === 2) S.flow.step = 1;
issueDue();
function fromHash(){
  const pm = location.hash.match(/^#plant-(PP-[\w-]+)$/); if (pm){ const o = allOrders().find(x => passTags(x).some(t => t.tag === pm[1])); if (o){ render(); openSheet(passportSheet(o.id, pm[1])); return true; } }
  const rm = location.hash.match(/^#ref-([\w-]+)$/); if (rm){ S.refCode = rm[1]; save(); render(); toast('Referral ' + rm[1] + ' applied'); return true; }
  const m = location.hash.match(/^#aisle-(\d+)$/); if (!m) return false; const row = AISLES.find(a => a[1] === +m[1]); if (!row) return false; S.role = 'customer'; S.screen = 'shop'; render(); window.scrollTo(0, 0); S.soDate = null; openSheet(aisleSheet(row[0])); return true; }
window.addEventListener('hashchange', fromHash);
if (!fromHash()) render();
})();
